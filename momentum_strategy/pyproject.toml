[project]
name = "momentum-strategy"
version = "0.1.0"
description = "A股动量择时策略：概念池 + 对数线性回归动量打分 + RSRS + 硬止损，基于 xtdata 回测"
requires-python = ">=3.8"
dependencies = ["numpy>=1.21", "pandas>=1.3"]

[project.scripts]
momentum-backtest = "momentum.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["momentum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
